[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insta360-go-toolkit"
version = "0.1.0"
description = "Control an Insta360 GO (1st gen) and export its footage, without the discontinued phone app"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Baraa Fadhloun" }]
license = { text = "MIT" }
keywords = ["insta360", "insta360 go", "action camera", "bluetooth", "ble", "reverse engineering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = ["bleak>=0.21"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]
protocol = ["protobuf>=4"]   # only for tools/extract_protocol.py

[project.scripts]
go1 = "insta360_go.cli:main"

[project.urls]
Homepage = "https://github.com/CSBaraa/insta360-go-toolkit"
Issues = "https://github.com/CSBaraa/insta360-go-toolkit/issues"
Protocol = "https://github.com/CSBaraa/insta360-go-toolkit/blob/main/docs/PROTOCOL.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
insta360_go = ["media/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]   # long lines are caught by the formatter, not worth failing CI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]
